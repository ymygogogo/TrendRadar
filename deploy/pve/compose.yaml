services:
  trendradar:
    image: ${TREND_IMAGE:?frozen image reference required}
    pull_policy: never
    restart: unless-stopped
    env_file: runtime.env
    environment:
      TZ: Asia/Shanghai
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      RUN_MODE: cron
      IMMEDIATE_RUN: "false"
      MARKET_ENABLED: "true"
      MARKET_FOCUSED_CRAWL: "true"
      MARKET_OPERATOR_SETTINGS: /app/admin-state/settings.json
      MARKET_STATUS_PATH: /app/admin-status/status.json
      MARKET_DIGEST_BASE_URL: https://tr.yumy.space
      AI_ANALYSIS_ENABLED: "false"
      AI_TRANSLATION_ENABLED: "false"
      LOCAL_RETENTION_DAYS: "30"
    volumes:
      - ./output:/app/output
      - ./admin-state:/app/admin-state:ro
      - ./admin-status:/app/admin-status
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  trendradar-admin:
    image: ${TREND_IMAGE:?frozen image reference required}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["python", "-m", "market_intelligence.admin", "serve"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "192.168.0.103:443:8443"
      - "192.168.0.103:80:8081"
      - "192.168.0.103:8080:8081"
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      MARKET_ENABLED: "true"
      MARKET_FOCUSED_CRAWL: "true"
      MARKET_OPERATOR_SETTINGS: /app/admin-state/settings.json
      MARKET_STATUS_PATH: /app/admin-status/status.json
      MARKET_ADMIN_TRUSTED_NETWORKS: 192.168.0.0/24,100.64.0.0/10
      MARKET_ADMIN_NEWS_URL: https://news.yumy.space/
      MARKET_ADMIN_HTTP_REDIRECT_PORT: "8081"
    volumes:
      - ./admin-state:/app/admin-state
      - ./admin-private:/app/admin-private:ro
      - ./admin-status:/app/admin-status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8443),3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
