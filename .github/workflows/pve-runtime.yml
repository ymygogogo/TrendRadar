name: Deploy PVE runtime configuration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trendradar-pve-runtime-direct
  cancel-in-progress: false
jobs:
  publish-and-deploy:
    if: github.repository == 'ymygogogo/TrendRadar' && github.ref == 'refs/heads/master'
    runs-on: trendradar-runtime-pve
    environment: trendradar-pve
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Encrypt runtime configuration for the VM
        env:
          MODEL_KEY: ${{ secrets.MODEL_KEY }}
          CHART_BOT: ${{ secrets.CHART_BOT }}
        run: |
          set -euo pipefail
          umask 077
          python3 deploy/pve/runtime_config.py seal "$RUNNER_TEMP/runtime.env.enc"
      - name: Publish encrypted configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view pve-runtime >/dev/null 2>&1; then
            gh release upload pve-runtime "$RUNNER_TEMP/runtime.env.enc" --clobber
          else
            gh release create pve-runtime "$RUNNER_TEMP/runtime.env.enc" --target "$GITHUB_SHA" --prerelease --title 'PVE encrypted runtime configuration' --notes 'Encrypted for the TrendRadar VM using its dedicated public certificate.'
          fi
      - name: Apply this encrypted configuration and wait for its health check
        env:
          PVE_DEPLOY_KEY: ${{ secrets.PVE_DEPLOY_KEY }}
          PVE_DEPLOY_KNOWN_HOSTS: ${{ vars.PVE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/runtime.env.enc" | cut -d' ' -f1)
          bash deploy/pve/ci-deploy.sh runtime "$digest"
